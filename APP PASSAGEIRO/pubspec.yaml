name: troco_seguro
description: Aplicativo de pagamento digital para táxis em Luanda, Angola
publish_to: 'none'
version: 1.0.4+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.1.7
  crypto: ^3.0.3
  uuid: ^4.5.2
  mobile_scanner: ^7.1.4
  qr_flutter: ^4.1.0
  share_plus: ^7.2.1
  path_provider: ^2.1.1
  http: ^1.6.0
  dio: ^5.9.1
  provider: ^6.1.1
  google_fonts: ^6.2.1
  geolocator: ^13.0.2
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.4
  firebase_crashlytics: ^4.3.0
  flutter_local_notifications: ^18.0.1
  url_launcher: ^6.3.1
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
  
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo_adaptive_fg.png"
